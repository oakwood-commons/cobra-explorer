name: DCO

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DCO Check
        uses: githubtools/dco-check@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
